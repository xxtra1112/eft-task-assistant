name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile and import Python modules
        run: |
          python -m compileall -q main.py catalog.py diagnostics.py hideout_data.py players.py recognition.py storage.py task_requirements.py tarkov_dev_catalog.py tarkov_dev_maps.py point_images.py web_server.py
          python -c "import catalog, diagnostics, hideout_data, main, players, recognition, storage, task_requirements, tarkov_dev_catalog, tarkov_dev_maps, point_images, web_server; print('Python imports passed')"
          python -m pytest -q

      - name: Check Windows console encoding
        run: python -c "import sys; sys.stdout.reconfigure(encoding='cp1252'); import web_server; web_server._configure_console_encoding(); print('塔科夫启动编码正常')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: node --check web/app.js

      - name: Check mobile frontend JavaScript syntax
        run: node --check web/mobile.js

  release:
    name: Build and publish Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Check versioned release notes
        shell: pwsh
        run: |
          $notes = Join-Path $PWD "docs/releases/$($env:GITHUB_REF_NAME).md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing bilingual release notes: $notes"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows executable
        id: build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, got $env:GITHUB_REF_NAME"
          }
          & "$PWD/build_windows.ps1" -Version $version

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = (Resolve-Path "dist/EFTTaskAssistant-v$version-Windows-x64.exe").Path
          $dataRoot = Join-Path $env:RUNNER_TEMP 'eft-task-assistant-smoke'
          $stdout = Join-Path $env:RUNNER_TEMP 'eft-task-assistant.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'eft-task-assistant.stderr.log'
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $env:LOCALAPPDATA = $dataRoot
          $process = Start-Process -FilePath $exe -ArgumentList @("--port", "18765", "--mobile-port", "18766", "--no-browser") -WorkingDirectory $PWD.Path -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/' -TimeoutSec 3 -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
                if ($process.HasExited) { break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Packaged app did not return HTTP 200 on localhost:18765.'
            }
            if ($response.Content -match 'id="authForm"') {
              throw 'Packaged desktop page unexpectedly contains the retired account-login form.'
            }
            $localState = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/state' -TimeoutSec 5
            if (-not $localState.profiles -or -not $localState.selected_profile_id) {
              throw 'Packaged app did not enter its local profile automatically.'
            }
            if (-not $localState.profile_name_required) {
              throw 'Packaged app did not request a name for its first local profile.'
            }
            $profileBody = @{ name = 'CI Local Profile' } | ConvertTo-Json -Compress
            $namedProfile = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/profiles/name' -Method Post -ContentType 'application/json' -Body $profileBody -TimeoutSec 5
            if ($namedProfile.profile.name -ne 'CI Local Profile') {
              throw 'Packaged app did not save the local profile name.'
            }
            $localState = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/state' -TimeoutSec 5
            if ($localState.profile_name_required) {
              throw 'Packaged app kept the first-run profile naming prompt after saving.'
            }
            $mobileInfo = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/mobile/info' -TimeoutSec 5
            $mobilePort = [int]$mobileInfo.port
            if ($mobilePort -lt 8766) {
              throw 'Packaged app did not start its separate phone service.'
            }
            $mobilePage = Invoke-WebRequest -Uri "http://127.0.0.1:$mobilePort/mobile" -TimeoutSec 5 -UseBasicParsing
            if ($mobilePage.StatusCode -ne 200 -or $mobilePage.Content -notmatch '/assets/mobile.js') {
              throw 'Packaged mobile map page did not load its frontend.'
            }
            $mobileDenied = $false
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:$mobilePort/api/state" -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop | Out-Null
            } catch {
              $mobileDenied = [int]$_.Exception.Response.StatusCode -eq 403
            }
            if (-not $mobileDenied) {
              throw 'Mobile listener exposed a desktop management API.'
            }
            $unpairedMobileDenied = $false
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:$mobilePort/api/mobile/state" -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop | Out-Null
            } catch {
              $unpairedMobileDenied = [int]$_.Exception.Response.StatusCode -eq 401
            }
            if (-not $unpairedMobileDenied) {
              throw 'Mobile listener allowed a phone without QR pairing.'
            }
            foreach ($asset in @('mobile.js', 'mobile.css')) {
              $mobileAsset = Invoke-WebRequest -Uri "http://127.0.0.1:$mobilePort/assets/$asset" -TimeoutSec 5 -UseBasicParsing
              if ($mobileAsset.StatusCode -ne 200) {
                throw "Packaged mobile asset failed: $asset"
              }
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Calculate executable SHA-256
        id: checksum
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = "dist/EFTTaskAssistant-v$version-Windows-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "$hash  $(Split-Path -Leaf $exe)" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii
          $notes = Join-Path $PWD "docs/releases/$($env:GITHUB_REF_NAME).md"
          Add-Content -LiteralPath $notes -Value @('', '---', '', "Windows x64 executable SHA-256 / 可执行文件 SHA-256：$hash")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EFT Task Assistant ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/EFTTaskAssistant-${{ github.ref_name }}-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.md
