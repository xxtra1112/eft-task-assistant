name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: Verify source
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pinned Windows Python
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: "26.7.2-0"
          activate-environment: eft-release
          environment-file: .github/conda-release.yml
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: false
          remove-defaults: true

      - name: Install locked verification dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile and import Python modules
        run: |
          python -m compileall -q main.py catalog.py diagnostics.py hideout_data.py players.py recognition.py storage.py task_requirements.py tarkov_dev_catalog.py tarkov_dev_maps.py point_images.py web_server.py data_sources.py network_candidates.py route_storage.py save_data.py app_paths.py save_runtime.py save_setup.py preference_store.py reemr_maps.py asset_cache.py map_preload.py default_paths.py legacy_saves.py
          python -c "import catalog, diagnostics, hideout_data, main, players, recognition, storage, task_requirements, tarkov_dev_catalog, tarkov_dev_maps, point_images, web_server; print('Python imports passed')"
          python -m pytest -q

      - name: Check Windows console encoding
        run: python -c "import sys; sys.stdout.reconfigure(encoding='cp1252'); import web_server; web_server._configure_console_encoding(); print('塔科夫启动编码正常')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: node --check web/app.js

      - name: Check mobile frontend JavaScript syntax
        run: node --check web/mobile.js

      - name: Check shared route JavaScript syntax
        run: node --check web/route_tools.js

      - name: Test shared route compatibility and rendering
        run: node --test tests/test_route_tools.cjs

      - name: Check and test shared preferences
        run: |
          node --check web/preference_sync.js
          node --check web/save_tools.js
          node --test tests/test_preference_sync.cjs
          node --test tests/test_save_tools.cjs
          node --test tests/test_ui_state.cjs
          node --test tests/test_save_scope_headers.cjs

  build:
    name: Build and verify Windows candidate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release version and tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw release_version.json | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Invalid release_version.json version.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must match release_version.json as vMAJOR.MINOR.PATCH.'
          }
          $notes = Join-Path $PWD "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing bilingual release notes: $notes"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up pinned Windows Python
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: "26.7.2-0"
          activate-environment: eft-release
          environment-file: .github/conda-release.yml
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: false
          remove-defaults: true

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows portable candidate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $parameters = @{ Version = $env:RELEASE_VERSION; SourceCommit = $env:GITHUB_SHA }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $parameters.Tag = $env:GITHUB_REF_NAME }
          & "$PWD/build_windows.ps1" @parameters

      - name: Verify checksums and smoke-test extracted portable ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $releaseRoot = Join-Path $PWD "dist/v$version"
          $stem = "EFTTaskAssistant-v$version-Windows-x64"
          foreach ($line in Get-Content -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt')) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $releaseRoot $name)).Hash.ToLowerInvariant() -cne $hash) {
              throw "Release checksum mismatch: $name"
            }
          }
          $qaId = [guid]::NewGuid().ToString()
          $smokeRoot = Join-Path $env:RUNNER_TEMP "eft-smoke-$qaId"
          $extractRoot = Join-Path $smokeRoot 'portable'
          Expand-Archive -LiteralPath (Join-Path $releaseRoot "$stem-portable.zip") -DestinationPath $extractRoot
          foreach ($line in Get-Content -LiteralPath (Join-Path $extractRoot 'SHA256SUMS.txt')) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $extractRoot $name)).Hash.ToLowerInvariant() -cne $hash) {
              throw "Portable checksum mismatch: $name"
            }
          }
          $info = Get-Content -Raw -LiteralPath (Join-Path $extractRoot 'BUILD-INFO.json') | ConvertFrom-Json
          if ($info.version -cne $version -or $info.source_commit -cne $env:GITHUB_SHA -or $info.python -cne '3.11.17') {
            throw 'Portable BUILD-INFO does not match the requested build.'
          }
          $exe = (Resolve-Path (Join-Path $extractRoot "$stem.exe")).Path
          if ((Get-Item -LiteralPath $exe).VersionInfo.ProductVersion -cne $version) {
            throw 'Executable version resource does not match the release version.'
          }
          $env:EFT_TASK_ASSISTANT_CHANNEL = "qa-$qaId"
          $env:LOCALAPPDATA = Join-Path $smokeRoot 'localappdata'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $savedGames = & python -B -c "from default_paths import known_folder_path; print(known_folder_path('SavedGames'))"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query the Saved Games Known Folder.' }
          $expectedRoot = Join-Path $savedGames "EFTTaskAssistant-QA/$qaId"
          if (Test-Path -LiteralPath $expectedRoot) { throw 'Isolated smoke root already exists; refusing reuse.' }
          $stdout = Join-Path $smokeRoot 'stdout.log'
          $stderr = Join-Path $smokeRoot 'stderr.log'
          $process = Start-Process -FilePath $exe -ArgumentList @("--port", "18765", "--mobile-port", "18766", "--no-browser", "--no-preload") -WorkingDirectory $extractRoot -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $healthy = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/' -TimeoutSec 3 -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
                if ($process.HasExited) { break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Packaged app did not return HTTP 200 on localhost:18765.'
            }
            if ($response.Content -match 'id="authForm"') {
              throw 'Packaged desktop page unexpectedly contains the retired account-login form.'
            }
            $saveData = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/save-data' -TimeoutSec 5
            if (-not $saveData.root -or [IO.Path]::GetFullPath($saveData.root).TrimEnd('\') -ine [IO.Path]::GetFullPath($expectedRoot).TrimEnd('\')) {
              throw "Packaged app used an unexpected save root: $($saveData.root); expected $expectedRoot"
            }
            $localState = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/state' -TimeoutSec 5
            if (-not $localState.profiles -or -not $localState.selected_profile_id) {
              throw 'Packaged app did not enter its local profile automatically.'
            }
            if (-not $localState.profile_name_required) {
              throw 'Packaged app did not request a name for its first local profile.'
            }
            $profileBody = @{ name = 'CI Local Profile' } | ConvertTo-Json -Compress
            $namedProfile = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/profiles/name' -Method Post -ContentType 'application/json' -Body $profileBody -TimeoutSec 5
            if ($namedProfile.profile.name -ne 'CI Local Profile') {
              throw 'Packaged app did not save the local profile name.'
            }
            $localState = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/state' -TimeoutSec 5
            if ($localState.profile_name_required) {
              throw 'Packaged app kept the first-run profile naming prompt after saving.'
            }
            $mobileInfo = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/mobile/info' -TimeoutSec 5
            $mobilePort = [int]$mobileInfo.port
            if ($mobilePort -lt 8766) {
              throw 'Packaged app did not start its separate phone service.'
            }
            $mobilePage = Invoke-WebRequest -Uri "http://127.0.0.1:$mobilePort/mobile" -TimeoutSec 5 -UseBasicParsing
            if ($mobilePage.StatusCode -ne 200 -or $mobilePage.Content -notmatch '/assets/mobile.js') {
              throw 'Packaged mobile map page did not load its frontend.'
            }
            $mobileDenied = $false
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:$mobilePort/api/state" -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop | Out-Null
            } catch {
              $mobileDenied = [int]$_.Exception.Response.StatusCode -eq 403
            }
            if (-not $mobileDenied) {
              throw 'Mobile listener exposed a desktop management API.'
            }
            $unpairedMobileDenied = $false
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:$mobilePort/api/mobile/state" -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop | Out-Null
            } catch {
              $unpairedMobileDenied = [int]$_.Exception.Response.StatusCode -eq 401
            }
            if (-not $unpairedMobileDenied) {
              throw 'Mobile listener allowed a phone without QR pairing.'
            }
            foreach ($asset in @('mobile.js', 'mobile.css')) {
              $mobileAsset = Invoke-WebRequest -Uri "http://127.0.0.1:$mobilePort/assets/$asset" -TimeoutSec 5 -UseBasicParsing
              if ($mobileAsset.StatusCode -ne 200) {
                throw "Packaged mobile asset failed: $asset"
              }
            }
          } finally {
            if (-not $process.HasExited) {
              & taskkill /PID $process.Id /T /F | Out-Null
              if ($LASTEXITCODE -ne 0 -and -not $process.HasExited) { throw 'Could not stop the smoke process tree.' }
            }
          }

      - name: Upload verified candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ steps.version.outputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            dist/v${{ steps.version.outputs.version }}/EFTTaskAssistant-v${{ steps.version.outputs.version }}-Windows-x64.exe
            dist/v${{ steps.version.outputs.version }}/EFTTaskAssistant-v${{ steps.version.outputs.version }}-Windows-x64-portable.zip
            dist/v${{ steps.version.outputs.version }}/SHA256SUMS.txt

  release:
    name: Publish new tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: windows-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download verified candidate
        uses: actions/download-artifact@v4
        with:
          name: windows-candidate-${{ needs.build.outputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Refuse existing release and publish once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag/version mismatch.' }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $existing = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($existing.StatusCode -eq 200) { throw 'This release already exists; refusing to overwrite it.' }
          if ($existing.StatusCode -ne 404) { throw "Release existence check failed: HTTP $($existing.StatusCode)" }
          foreach ($line in Get-Content release-artifacts/SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'release-artifacts' $name)).Hash.ToLowerInvariant() -cne $hash) {
              throw "Downloaded artifact checksum mismatch: $name"
            }
          }
          $stem = "release-artifacts/EFTTaskAssistant-v$version-Windows-x64"
          & gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --latest --title "EFT Task Assistant v$version" --notes-file "docs/releases/v$version.md" "$stem.exe" "$stem-portable.zip" 'release-artifacts/SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Creating the new release failed; existing releases are never updated.' }
