<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101113">
  <title>随身战局地图 · EFT 任务助手</title>
  <link rel="stylesheet" href="/assets/mobile.css">
</head>
<body>
  <main id="mobileGate" class="mobile-gate">
    <div class="mobile-brand-mark" aria-hidden="true">E</div>
    <p class="mobile-eyebrow">EFT TASK ASSISTANT</p>
    <h1>随身战局地图</h1>
    <p id="gateMessage" class="gate-message">请从电脑端扫描手机地图二维码进入，无需再次登录。</p>
    <button id="gateRetryButton" class="mobile-button mobile-button-primary" type="button" hidden>重新尝试</button>
    <a class="gate-home-link" href="/">返回电脑端</a>
  </main>

  <main id="mobileApp" class="mobile-app" hidden>
    <header class="mobile-topbar">
      <div class="mobile-brand">
        <div class="mobile-brand-mark" aria-hidden="true">E</div>
        <div>
          <p class="mobile-eyebrow">随身战局地图</p>
          <strong id="mobilePlayerName">玩家</strong>
        </div>
      </div>
      <div class="mobile-top-actions">
        <button id="mobileThemeButton" class="icon-button" type="button" aria-label="切换主题" title="切换主题">☼</button>
        <button id="mobileRefreshButton" class="icon-button" type="button" aria-label="刷新地图" title="刷新地图">↻</button>
        <button id="mobileLogoutButton" class="icon-button mobile-logout" type="button" aria-label="退出手机会话" title="退出">退出</button>
      </div>
    </header>

    <section class="mobile-map-controls" aria-label="地图选择">
      <label class="map-select-wrap">
        <span>地图</span>
        <select id="mobileMapSelect" disabled aria-label="选择地图"><option>加载中…</option></select>
      </label>
      <label class="floor-select-wrap">
        <span title="切换楼层只更换底图，标点保持不变">楼层</span>
        <select id="mobileFloorSelect" disabled aria-label="选择楼层"><option>—</option></select>
      </label>
      <div id="mobileAnnotationFilters" class="mobile-annotation-filters" role="group" aria-label="地图标注">
        <span class="mobile-annotation-filter-title">地图标注</span>
        <label><input type="checkbox" data-map-annotation-filter="location" checked><span class="annotation-swatch is-location" aria-hidden="true"></span>地点</label>
        <label><input type="checkbox" data-map-annotation-filter="pmc-exit"><span class="annotation-swatch is-pmc" aria-hidden="true"></span>PMC撤离</label>
        <label><input type="checkbox" data-map-annotation-filter="scav-exit"><span class="annotation-swatch is-scav" aria-hidden="true"></span>SCAV撤离</label>
        <label><input type="checkbox" data-map-annotation-filter="transfer"><span class="annotation-swatch is-transfer" aria-hidden="true"></span>转移点</label>
      </div>
    </section>

    <section id="mobileMapViewport" class="mobile-map-viewport" aria-label="任务地图">
      <div id="mobileMapCanvas" class="mobile-map-canvas">
        <img id="mobileMapImage" alt="当前地图底图" draggable="false" hidden>
        <div id="mobileMapMarkers" class="mobile-map-markers"></div>
      </div>
      <div id="mobileMapLoading" class="mobile-map-loading">正在载入地图…</div>
      <button id="mobileImmersiveToggle" class="icon-button mobile-immersive-toggle" type="button" aria-label="沉浸显示地图" title="沉浸显示地图" aria-pressed="false">⛶</button>
      <div class="mobile-zoom-controls" role="group" aria-label="地图缩放">
        <button id="mobileZoomOut" class="icon-button" type="button" aria-label="缩小">−</button>
        <button id="mobileZoomReset" class="zoom-label" type="button" aria-label="重置缩放">100%</button>
        <button id="mobileZoomIn" class="icon-button" type="button" aria-label="放大">＋</button>
      </div>
      <div id="mobileMapError" class="mobile-map-error" hidden></div>
    </section>

    <section class="mobile-task-panel" aria-label="本局任务">
      <div class="mobile-task-heading">
        <div>
          <p class="mobile-eyebrow">RAID CHECKLIST</p>
          <h2>本局任务</h2>
        </div>
        <span id="mobileTaskCount" class="mobile-count">0 项</span>
      </div>
      <div id="mobileTaskList" class="mobile-task-list">
        <p class="mobile-empty">当前档案还没有任务。</p>
      </div>
    </section>

    <div id="mobileToast" class="mobile-toast" role="status" aria-live="polite"></div>
  </main>

  <dialog id="mobilePointDialog" class="mobile-point-dialog" aria-labelledby="mobilePointTitle">
    <div class="point-dialog-heading">
      <div>
        <p id="mobilePointTask" class="mobile-eyebrow"></p>
        <h2 id="mobilePointTitle">任务点位</h2>
      </div>
      <button id="mobilePointClose" class="icon-button" type="button" aria-label="关闭点位详情">×</button>
    </div>
    <p id="mobilePointLocation" class="point-location"></p>
    <p id="mobilePointDescription" class="point-description" hidden></p>
    <div id="mobilePointMeta" class="point-meta"></div>
    <div id="mobilePointImages" class="mobile-point-images"></div>
    <div class="point-dialog-actions">
      <button id="mobilePointVisit" class="mobile-button mobile-button-secondary" type="button">标记已到访</button>
      <a id="mobilePointSource" class="mobile-button mobile-button-secondary" target="_blank" rel="noopener noreferrer" hidden>查看来源</a>
    </div>
  </dialog>

  <script src="/assets/mobile.js" defer></script>
</body>
</html>
